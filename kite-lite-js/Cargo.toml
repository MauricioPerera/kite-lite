[package]
name = "kite-lite-js"
version = "0.1.3"
edition = "2021"
description = "Standalone JavaScript evaluator child process for kite-lite. Has no reqwest/tokio dependency declared, so it cannot make network requests regardless of what a script tries to do."
license = "MIT"

[dependencies]
anyhow = "1"
serde_json = "1"
kite-lite-core = { path = "../kite-lite-core", version = "0.1.3" }

[package]
name = "kite-lite"
version = "0.1.1"
edition = "2021"
description = "A lightweight, agent-first web page engine"
license = "MIT"
repository = "https://github.com/MauricioPerera/kite-lite"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
boa_engine = "0.20"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "cookies"] }
resvg = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tungstenite = "0.30"
url = "2"
usvg = "0.44"

[lib]
name = "kite_lite_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kite-lite"
path = "src/main.rs"

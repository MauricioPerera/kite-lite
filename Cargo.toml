[workspace]
resolver = "2"
members = ["kite-lite-core", "kite-lite-js", "kite-lite"]
# So bare `cargo run -- ...`/`cargo run -- serve ...` at the repo root (as
# the README's "Probarlo" section documents) keeps working unambiguously —
# without this, `cargo run` at a workspace root with two binary-producing
# members (`kite-lite`, `kite-lite-js`) refuses to guess which one to run.
default-members = ["kite-lite"]

# `kite-lite-js` deliberately has no path to `reqwest`/`tokio` in its own
# Cargo.toml (see kite-lite-js/Cargo.toml) — that's the actual enforcement
# mechanism for the isolation this project's README describes: not a
# convention someone has to remember, but a dependency graph that won't
# compile if anyone adds `use reqwest` there or to `kite-lite-core`. See the
# README's "Probarlo" section for why that binary exists as a separate
# process at all.

[package]
name = "kite-lite"
version = "0.1.0"
edition = "2021"
description = "A lightweight, agent-first web page engine"
license = "MIT"

[dependencies]
anyhow = "1"
boa_engine = "0.20"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tungstenite = "0.30"

[lib]
name = "kite_lite_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kite-lite"
path = "src/main.rs"

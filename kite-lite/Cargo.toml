[package]
name = "kite-lite"
version = "0.1.5"
edition = "2021"
description = "A lightweight, agent-first web page engine"
license = "MIT"
repository = "https://github.com/MauricioPerera/kite-lite"
readme = "../README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
kite-lite-core = { path = "../kite-lite-core", version = "0.1.5" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tungstenite = "0.30"
url = "2"

[[bin]]
name = "kite-lite"
path = "src/main.rs"

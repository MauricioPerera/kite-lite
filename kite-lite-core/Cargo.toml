[package]
name = "kite-lite-core"
version = "0.1.5"
edition = "2021"
description = "DOM, layout, JS sandbox, and rendering engine behind kite-lite. No networking dependency."
license = "MIT"
repository = "https://github.com/MauricioPerera/kite-lite"

[dependencies]
anyhow = "1"
boa_engine = "0.20"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }
resvg = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
url = "2"
usvg = "0.44"

[lib]
name = "kite_lite_core"
crate-type = ["rlib", "cdylib"]
